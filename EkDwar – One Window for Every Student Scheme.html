function deoV(tab){if(tab=='q'){const A=DB.apps.filter(a=>a.st=='Forwarded to DEO').map(appRow);return A.length?`<div class="card tw"><table><tr><th>Application</th><th>Student</th><th>Eligibility</th><th>Decision</th></tr>${A.map(({a,s,c})=>`<tr><td>${a.id}<br>${c.n}</td><td>${h(s.nm)}<br><small>${h(s.dist)}</small></td><td>${eChip(ev(s,c).st)}</td><td><input id="rs_${a.id}" placeholder="Reason (needed to reject)" aria-label="Reason"> <button class="b" data-a="de:ok" data-v="${a.id}">Approve</button> <button class="b r" data-a="de:rej" data-v="${a.id}">Reject</button></td></tr>`).join('')}</table></div>`:'<div class="card">No applications are waiting for DEO approval.</div>'}
if(tab=='y')return payV();if(tab=='l')return auditV();return statV()+`<div class="card"><h3>Bicycle distribution</h3>${bars({Allocated:DB.dlv.filter(d=>d.st=='Allocated').length,Dispatched:DB.dlv.filter(d=>d.st=='Dispatched').length,Delivered:DB.dlv.filter(d=>d.st=='Delivered').length})}</div>`}
const payV=()=>`<div class="card tw"><h3>DBT payments <small>Simulated PFMS. No real transfer happens.</small></h3><table><tr><th>Reference</th><th>Beneficiary</th><th>Scheme</th><th>Amount (demo)</th><th>Bank</th><th>Status</th><th>Date</th></tr>${DB.pay.map(p=>{const s=stu(p.sid),a=DB.apps.find(x=>x.id==p.aid);return`<tr><td>${p.ref}<br><small>${p.aid}</small></td><td>${h(s.nm)}</td><td>${sch(a.sc).n}</td><td>₹${p.amt.toLocaleString('en-IN')}</td><td>${s.bank?'Verified':'Pending'}</td><td><select data-pay="${p.ref}" aria-label="Payment status">${['Pending','Processing','Credited','Failed'].map(x=>`<option ${x==p.st?'selected':''}>${x}</option>`).join('')}</select></td><td>${fmt(p.dt)}</td></tr>`}).join('')||'<tr><td colspan=7>No payments yet.</td></tr>'}</table></div>`;
const auditV=()=>`<div class="card tw"><h3>Audit log</h3><table><tr><th>User</th><th>Action</th><th>Time</th><th>Reference</th></tr>${DB.audit.slice(0,80).map(x=>`<tr><td>${h(x.u)}</td><td>${h(x.a)}</td><td>${fmt(x.ts)}</td><td>${h(x.ref)}</td></tr>`).join('')}</table></div>`;
function statV(){const by=(f)=>{const o={};DB.apps.forEach(a=>{const k=f(a);o[k]=(o[k]||0)+1});return o};return`<div class="grid"><div class="card"><h3>Scheme-wise applications</h3>${bars(by(a=>sch(a.sc).id))}</div><div class="card"><h3>District-wise applications</h3>${bars(by(a=>stu(a.sid).dist))}</div><div class="card"><h3>By status</h3>${bars(by(a=>a.st))}</div></div>`}
function vendV(){if(V.id){const d=DB.dlv.find(x=>x.id==V.id);if(d){const s=stu(d.sid);return`<div class="card"><button class="b s" data-a="ve:back">Back to list</button><h3>${d.id} for ${h(s.nm)} <small>${s.id}</small></h3><p>${chip(d.st,d.st=='Delivered'?'ok':'bl')}</p>
${d.st=='Delivered'?`<div class="n"><b>Delivery confirmation receipt</b><br>${d.rc}<br>Delivered ${fmt(d.at)} by vendor ${d.v} to student ${d.sid}.</div><button class="b s" data-a="print">Print receipt</button>`:`<p>Step 1. Scan the student QR code with the camera, or use manual verify if the camera is unavailable.</p><div class="row"><div class="qr" id="qr" data-t="EKDWAR|${d.id}|${d.sid}"></div><div><button class="b t" data-a="ve:cam">Scan with camera</button> <button class="b s" data-a="ve:scan">${V.scan?'QR verified ✓':'Manual verify'}</button><video id="cam" playsinline muted style="display:none;width:240px;border-radius:8px;margin-top:8px"></video><p class="mu">${V.scan?'Payload matches delivery '+d.id+'.':''}</p></div></div>
<label for="otp">Step 2. Enter parent OTP (4 digits)</label><input id="otp" inputmode="numeric" maxlength="4"><p><button class="b" data-a="ve:ok">Confirm handover</button></p>`}</div>`}}
const q=(F.q||'').toLowerCase();return`<div class="card"><div class="row"><input id="q" placeholder="Search by delivery ID" value="${h(F.q)}" data-f="q" aria-label="Search delivery"></div><div class="tw"><table><tr><th>Delivery</th><th>Student</th><th>Status</th><th>Action</th></tr>${DB.dlv.filter(d=>d.v==S.u.id&&(!q||d.id.toLowerCase().includes(q))).map(d=>`<tr><td>${d.id}</td><td>${h(stu(d.sid).nm)}</td><td>${chip(d.st,d.st=='Delivered'?'ok':'bl')}</td><td>${d.st=='Allocated'?`<button class="b" data-a="ve:disp" data-v="${d.id}">Mark dispatched</button>`:`<button class="b s" data-a="ve:open" data-v="${d.id}">${d.st=='Delivered'?'View receipt':'Verify delivery'}</button>`}</td></tr>`).join('')||'<tr><td colspan=4>No deliveries match.</td></tr>'}</table></div></div>`}
function adminV(tab){const S_=DB.students,A=DB.apps;
if(tab=='o')return`<div class="k"><div><b>${S_.length}</b>Registered students</div><div><b>${S_.filter(s=>SCH.some(c=>ev(s,c).st=='elig')).length}</b>Eligible students</div><div><b>${A.length}</b>Applications</div><div><b>${A.filter(a=>['Approved','Payment Processing','Benefit Delivered'].includes(a.st)).length}</b>Approved</div><div><b>${A.filter(a=>['School Verification','Forwarded to DEO'].includes(a.st)).length}</b>Pending</div><div><b>${A.filter(a=>a.st=='Rejected').length}</b>Rejected</div><div><b>${DB.pay.filter(p=>p.st=='Credited').length}</b>DBT beneficiaries</div><div><b>${DB.dlv.length}</b>Bicycles allocated</div><div><b>${DB.dlv.filter(d=>d.st=='Delivered').length}</b>Bicycles delivered</div></div>`+statV()+`<p><button class="b r" data-a="ad:reset">Reset demo data</button></p>`;
if(tab=='a'){const rows=A.map(appRow).filter(({a,s,c})=>(!F.d||s.dist==F.d)&&(!F.s||s.sch==F.s)&&(!F.sc||c.id==F.sc)&&(!F.c||s.cls==F.c)&&(!F.st||a.st==F.st)&&(!F.q||(a.id+s.nm+s.id).toLowerCase().includes(F.q.toLowerCase())));
return`<div class="card"><div class="row"><div>District ${sel('fd',[...new Set(S_.map(s=>s.dist))],F.d,'d')}</div><div>School ${sel('fs',[...new Set(S_.map(s=>s.sch))],F.s,'s')}</div><div>Scheme ${sel('fsc',SCH.map(c=>c.id),F.sc,'sc')}</div><div>Class ${sel('fc',[9,10,11,12],F.c,'c')}</div><div>Status ${sel('fst',ST,F.st,'st')}</div><div>Search <input id="q" value="${h(F.q)}" data-f="q" placeholder="ID or name" aria-label="Search"></div></div></div><div class="card tw"><table><tr><th>Application</th><th>Student</th><th>Scheme</th><th>Status</th><th>Updated</th><th>Override</th></tr>${rows.map(({a,s,c})=>`<tr><td>${a.id}</td><td>${h(s.nm)}<br><small>${h(s.dist)}, class ${s.cls}</small></td><td>${c.id}</td><td>${chip(a.st,a.st=='Rejected'?'er':a.st=='Benefit Delivered'?'ok':'bl')}</td><td>${fmt(a.up)}</td><td><select data-ov="${a.id}" aria-label="Set status">${ST.map(x=>`<option ${x==a.st?'selected':''}>${x}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=6>No applications match these filters. Clear a filter to see more.</td></tr>'}</table></div>`}
if(tab=='y')return payV();if(tab=='l')return auditV();
return`<div class="card tw"><h3>Eligibility rules <small>Illustrative demo values. Edit them and students are re-checked.</small></h3><table><tr><th>Scheme</th><th>Max income (₹)</th><th>Min marks (%)</th><th>Min attendance (%)</th></tr>${SCH.map((c,i)=>{const r=DB.rules[i];return`<tr><td>${c.n}</td>${['inc','mk','att'].map(k=>`<td>${k in r?`<input type="number" min="0" value="${r[k]}" data-rule="${i}:${k}" aria-label="${c.id} ${k}" style="width:110px">`:'–'}</td>`).join('')}</tr>`}).join('')}</table></div>`}
const TABS={student:[['d','dash'],['p','prof'],['a','apps'],['b','cyc'],['n','alerts']],staff:[['r','Review'],['s','Students'],['b','Bicycles']],deo:[['q','Queue'],['y','Payments'],['t','Stats'],['l','Audit']],vendor:[['v','Deliveries']],admin:[['o','Overview'],['a','Applications'],['y','Payments'],['r','Rules'],['l','Audit']]};
function R(){const u=S.u,app=$('#app');let body='',tabs='';
const top=`<div class="top"><b>EkDwar</b><span class="demo">Simulated integrations</span><span class="mu" style="color:#bcd">SFIC 2026, Education Department, Government of Gujarat, SSIP 2.0</span><span class="sp"></span><button class="${L=='en'?'on':''}" data-a="lang" data-v="en">EN</button><button class="${L=='gu'?'on':''}" data-a="lang" data-v="gu">ગુજરાતી</button>${u?`<span>${h(u.sid?stu(u.sid).nm:u.nm)}</span><button data-a="out">${t('out')}</button>`:''}</div>`;
const foot=`<div class="wrap"><small>Integrations with CTS, Aadhaar, DigiLocker and PFMS are simulated. Real use needs departmental approval, credentials and API access. Eligibility rules are illustrative, not official.</small></div>`;
if(!u){app.innerHTML=top+loginV()+foot;return}
const r=u.r,tl=TABS[r];if(!tl.some(x=>x[0]==S.t))S.t=tl[0][0];
tabs=`<div class="tabs" role="tablist">${tl.map(x=>`<button class="${S.t==x[0]?'on':''}" data-a="tab" data-v="${x[0]}">${t(x[1])}</button>`).join('')}</div>`;
const s=u.sid?me():null,k=S.t;
if(r=='student')body={d:()=>`<h2>${t('welcome')}, ${h(s.nm)}</h2>`+dashV(s),p:()=>profV(s),a:()=>appsV(s),b:()=>bikeV(s),n:()=>alertV(s)}[k]();
else if(r=='staff')body=staffV(k);else if(r=='deo')body=deoV(k);else if(r=='vendor')body=vendV();else body=adminV(k);
app.innerHTML=top+`<div class="wrap">${tabs}${body}</div>`+foot;
document.querySelectorAll('[data-t]').forEach(e=>{if(window.QRCode)new QRCode(e,{text:e.dataset.t,width:140,height:140});else e.textContent=e.dataset.t})}
/* ---------- actions ---------- */
function act(a,v){const p=a.split(':')[0];if(ROLEOK[p]&&(!S.u||!ROLEOK[p].includes(S.u.r)))return toast('Not permitted for this role');
const val=id=>{const e=$('#'+id);return e?e.value.trim():''},app=id=>DB.apps.find(x=>x.id==id);
switch(a){
case'lang':L=v;break;case'tab':S.t=v;sv();break;
case'role':O.role=v;O.sent=0;O.mob=Object.keys(USERS).find(m=>USERS[m].r==v);break;
case'fill':O.mob=v;O.role=USERS[v].r;break;
case'send':O.mob=val('mob')||O.mob;if(!/^\d{10}$/.test(O.mob))return toast('Enter a 10-digit mobile number');O.sent=1;toast('Demo OTP 123456 sent (simulated)');break;
case'verify':{const m=O.mob,u=USERS[m];if(!u||u.r!=O.role){toast('This number is not registered for the selected role');return}if(val('otp')!=='123456'){toast('Wrong OTP. Use the demo OTP 123456');return}
S={u,sid:u.sid,t:''};sv();log(u.sid||u.id,'Login',u.sid||u.id);if(u.sid)reeval(stu(u.sid));O.sent=0;break}
case'out':log(who(),'Logout');S={};sv();save();break;
case'st:chk':reeval(me(),1);log(who(),'Eligibility check',S.sid);break;
case'st:apply':{const s=me(),c=sch(v);if(ev(s,c).st!='elig')return toast('Not eligible for this scheme');if(DB.apps.some(x=>x.sid==s.id&&x.sc==v&&x.st!='Rejected'))return toast('Already applied');
const x={id:'APP-'+DB.n++,sid:s.id,sc:v,st:'Submitted',dt:new Date().toISOString(),up:'',rs:'',hist:[]};DB.apps.push(x);log(s.id,'Application submitted',x.id);setSt(x,'School Verification');toast('Application '+x.id+' submitted to school');break}
case'st:draft':{const s=me();if(ev(s,sch(v)).st!='elig')return toast('Not eligible for this scheme');if(DB.apps.some(x=>x.sid==s.id&&x.sc==v&&x.st!='Rejected'))return toast('Already started');const x={id:'APP-'+DB.n++,sid:s.id,sc:v,st:'Draft',dt:new Date().toISOString(),up:new Date().toISOString(),rs:'',hist:[]};DB.apps.push(x);log(s.id,'Draft saved',x.id);save();toast('Draft '+x.id+' saved. Submit it from Applications');break}
case'st:sub':{const x=app(v);if(!x||x.sid!=S.sid||x.st!='Draft')return;const s=me();if(ev(s,sch(x.sc)).st!='elig')return toast('Profile no longer meets the rules. Update it first');x.dt=new Date().toISOString();log(s.id,'Application submitted',x.id);setSt(x,'School Verification');toast('Application '+x.id+' submitted to school');break}
case'st:prof':{const s=me(),g=id=>Number(val(id)),c=g('f_cls'),i=g('f_inc'),m=g('f_mk'),at=g('f_att');
if(!(c>=9&&c<=12)||!(i>=0)||!(m>=0&&m<=100)||!(at>=0&&at<=100))return toast('Check values: class 9–12, marks and attendance 0–100, income 0 or more');
Object.assign(s,{cls:c,inc:i,mk:m,att:at,cat:val('f_cat'),sci:Number(val('f_sci'))});log(s.id,'Profile updated',s.id);reeval(s,1);break}
case'st:bank':me().bank=1;log(S.sid,'Bank verified (simulated)',S.sid);reeval(me(),1);break;
case'st:doc':me().docs.push(v);log(S.sid,'Document added',S.sid);save();toast(v+' added');break;
case'st:read':DB.notif.forEach(n=>{if(n.sid==S.sid)n.rd=1});save();break;
case'sf:fwd':setSt(app(v),'Forwarded to DEO');log(who(),'School verification',v);toast('Forwarded to DEO');break;
case'sf:rej':case'de:rej':{const r=val('rs_'+v);if(!r)return toast('Enter a rejection reason first');setSt(app(v),'Rejected',r);toast('Application rejected');break}
case'de:ok':setSt(app(v),'Approved');log(who(),'DEO approval',v);toast('Approved');break;
case've:disp':{const d=DB.dlv.find(x=>x.id==v);d.st='Dispatched';note(d.sid,'Bicycle dispatched. Delivery ID '+d.id+'.');log(who(),'Bicycle dispatched',d.id);save();break}
case've:open':V={id:v,scan:0};break;case've:back':V={id:'',scan:0};break;
case've:cam':{if(!window.BarcodeDetector||!navigator.mediaDevices)return toast('Camera scanning is not supported in this browser. Use manual verify');const d=DB.dlv.find(x=>x.id==V.id),vd=$('#cam');navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}}).then(m=>{vd.style.display='block';vd.srcObject=m;vd.play();const bd=new BarcodeDetector({formats:['qr_code']}),tick=()=>{if(!vd.srcObject)return;bd.detect(vd).then(r=>{if(r.length&&r[0].rawValue==='EKDWAR|'+d.id+'|'+d.sid){m.getTracks().forEach(x=>x.stop());vd.srcObject=null;V.scan=1;log(who(),'QR scanned (camera)',d.id);R()}else setTimeout(tick,300)}).catch(()=>setTimeout(tick,300))};tick()}).catch(()=>toast('Camera permission denied. Use manual verify'));return}
case've:scan':V.scan=1;log(who(),'QR scanned (simulated)',V.id);break;
case've:ok':{const d=DB.dlv.find(x=>x.id==V.id);if(!V.scan)return toast('Scan the QR code first');if(val('otp')!==d.otp)return toast('Incorrect parent OTP');
d.st='Delivered';d.at=new Date().toISOString();d.rc='RCPT-'+d.id.slice(4);setSt(app(d.aid),'Benefit Delivered');note(d.sid,'Bicycle delivered. Receipt '+d.rc+'.');log(who(),'Bicycle delivery verified',d.id);toast('Handover confirmed');break}
case'ad:reset':DB=seed();save();S.t='o';toast('Demo data reset');break;
case'print':window.print();return}
R()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(b){e.preventDefault();act(b.dataset.a,b.dataset.v)}});
document.addEventListener('change',e=>{const g=e.target,d=g.dataset;
if(d.f){F[d.f]=g.value;R();if(d.f=='q'){const i=$('#q');i&&i.focus()}}
else if(d.pay){const p=DB.pay.find(x=>x.ref==d.pay);if(!S.u||!['deo','admin'].includes(S.u.r))return;const s=stu(p.sid);
if(g.value=='Credited'&&!s.bank){toast('Bank verification is pending. Cannot credit.');R();return}
p.st=g.value;p.dt=g.value=='Credited'?new Date().toISOString():p.dt;log(who(),'Payment status → '+p.st,p.ref);
if(p.st=='Credited'){const a=DB.apps.find(x=>x.id==p.aid);setSt(a,'Benefit Delivered');note(p.sid,'Payment credited: ₹'+p.amt.toLocaleString('en-IN')+' ('+p.ref+')')}save();toast('Payment '+p.st);R()}
else if(d.ov){if(!S.u||S.u.r!='admin')return;const a=DB.apps.find(x=>x.id==d.ov);if(g.value=='Rejected'){a.rs='Set by admin';}setSt(a,g.value,a.rs);toast('Status updated');R()}
else if(d.rule){const[i,k]=d.rule.split(':'),n=Number(g.value);if(!(n>=0))return toast('Enter a number');DB.rules[i][k]=n;log(who(),'Rule edited: '+SCH[i].id+' '+k);DB.students.forEach(s=>reeval(s));toast('Rule saved. Students re-checked.')}});
let LA=Date.now();['click','keydown'].forEach(k=>document.addEventListener(k,()=>LA=Date.now()));
setInterval(()=>{if(S.u&&Date.now()-LA>9e5){S={};sv();toast('Signed out after 15 minutes of inactivity');R()}},30000);
R();
</script></body></html>
